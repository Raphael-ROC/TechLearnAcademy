<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Meu perfil | TechLearn Academy</title>
        <link rel="stylesheet" href="css/estilo.css">
        <script src="js/config.js" defer>
        </script>
        <script src="js/api.js" defer>
        </script>
        <script src="js/perfil.js" defer>
        </script>
    </head>
    <body data-pagina="perfil">
        <a class="pular" href="#conteudo">Ir para o conteúdo</a>
        <header class="cabecalho">
            <a class="marca" href="perfil.html">
                <span class="simbolo" aria-hidden="true">TL</span>
                <span>TechLearn Academy</span>
            </a>
            <div class="usuario">
                <span id="nome-usuario">
                </span>
                <button id="sair" type="button">Sair</button>
            </div>
        </header>
        <nav id="menu" class="menu" aria-label="Menu principal">
        </nav>
        <main class="conteudo">
            <div class="introducao">
                <p class="rotulo">Seu espaço de aprendizagem</p>
                <h1>Meu perfil</h1>
                <p class="subtitulo">Seus dados e sua segurança em um só lugar.</p>
            </div>
            <p id="mensagem" class="mensagem" role="status" aria-live="polite" aria-atomic="true">
            </p>
            <div id="conteudo">
                <div class="blocos">
                    <section class="cartao">
                        <h2>Dados da conta</h2>
                        <p>Perfil: <strong id="perfil">
                            </strong>
                        </p>
                        <form id="form-perfil">
                            <div class="campo">
                                <label for="nome">Nome</label>
                                <input id="nome" name="nome" type="text" autocomplete="name" required maxlength="100">
                            </div>
                            <div class="campo">
                                <label for="email">E-mail</label>
                                <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
                            </div>
                            <div class="campo"><label for="email-contato">E-mail pessoal para recuperação de senha</label>
                                <input id="email-contato" type="email" required maxlength="254"></div>
                            <button type="submit">Salvar dados</button>
                        </form>
                    </section>
                    <template id="modelo-senha"><section class="cartao">
                        <h2>Trocar senha</h2>
                        <form id="form-senha">
                            <div class="campo">
                                <label for="senha-atual">Senha atual</label>
                                <input id="senha-atual" name="senha-atual" type="password" autocomplete="current-password" required>
                            </div>
                            <div class="campo">
                                <label for="senha">Senha</label>
                                <input id="senha" name="senha" type="password" autocomplete="new-password" aria-describedby="regra-senha" required>
                            </div>
                            <p id="regra-senha" class="ajuda">Pelo menos 8 caracteres, uma letra maiúscula, um número e um caractere especial. Espaços não são permitidos.</p>
                            <div class="campo">
                                <label for="confirmar-senha">Confirmar senha</label>
                                <input id="confirmar-senha" name="confirmar-senha" type="password" autocomplete="new-password" required>
                            </div>
                            <button type="submit">Alterar senha</button>
                            <p class="linha"><a href="recuperar-senha.html">Recuperar senha por e-mail</a></p>
                        </form>
                    </section></template>
                </div>
            </div>
        </main>
        <footer class="rodape">TechLearn Academy · Conhecimento para abrir novos caminhos.</footer>
    </body>
</html>
