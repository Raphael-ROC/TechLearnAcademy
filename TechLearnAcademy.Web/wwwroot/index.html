<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Entrar | TechLearn Academy</title>
        <link rel="stylesheet" href="css/estilo.css">
        <script src="js/config.js" defer>
        </script>
        <script src="js/api.js" defer>
        </script>
        <script src="js/publico.js" defer>
        </script>
    </head>
    <body data-pagina="login">
        <a class="pular" href="#conteudo">Ir para o formulário</a>
        <main class="publico">
            <section class="apresentacao" aria-label="Sobre a plataforma">
                <a class="marca" href="index.html">
                    <span class="simbolo" aria-hidden="true">TL</span>
                    <span>TechLearn Academy</span>
                </a>
                <div>
                    <p class="rotulo">Aprenda no seu ritmo</p>
                    <h1>Seu próximo aprendizado começa aqui.</h1>
                    <p>Uma plataforma de cursos de programação para aprender, praticar e crescer.</p>
                </div>
                
            </section>
            <section id="conteudo" class="form-publico">
                <p class="rotulo">Acesso à plataforma</p>
                <h2>Entrar</h2>
                <p class="subtitulo">Acesse seus cursos, seu progresso e sua equipe.</p>
                <form id="form-login">
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
                    </div>
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit">Entrar</button>
                </form>
                <div class="links-publicos">
                    <a href="cadastro.html">Criar conta</a>
                    <a href="recuperar-senha.html">Esqueci minha senha</a>
                </div>
                <p id="mensagem" class="mensagem" role="status" aria-live="polite" aria-atomic="true">
                </p>
            </section>
        </main>
    </body>
</html>
