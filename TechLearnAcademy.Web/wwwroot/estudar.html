<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Hora de estudar | TechLearn Academy</title>
        <link rel="stylesheet" href="css/estilo.css">
        <script src="js/config.js" defer>
        </script>
        <script src="js/api.js" defer>
        </script>
        <script src="js/aluno.js" defer>
        </script>
    </head>
    <body data-pagina="estudar">
        <a class="pular" href="#conteudo">Ir para o conteúdo</a>
        <header class="cabecalho">
            <a class="marca" href="perfil.html">
                <span class="simbolo" aria-hidden="true">TL</span>
                <span>TechLearn Academy</span>
            </a>
            <div class="usuario">
                <span id="nome-usuario">
                </span>
                <button id="sair" type="button">Sair</button>
            </div>
        </header>
        <nav id="menu" class="menu" aria-label="Menu principal">
        </nav>
        <main class="conteudo">
            <div class="introducao">
                <p class="rotulo">Seu espaço de aprendizagem</p>
                <h1>Hora de estudar</h1>
                <p class="subtitulo">Leia os materiais, pratique e conclua cada etapa.</p>
            </div>
            <p id="mensagem" class="mensagem" role="status" aria-live="polite" aria-atomic="true">
            </p>
            <div id="conteudo">
                <section id="detalhes" class="cartao bloco">
                </section>
                <h2>Materiais do módulo</h2>
                <div id="materiais" class="cartao bloco">
                </div>
                <div class="acoes bloco">
                    <button id="concluir" type="button">Marcar como concluído</button>
                </div>
                <h2>Avaliações do módulo</h2>
                <div id="lista" class="grade">
                </div>
            </div>
        </main>
        <footer class="rodape">TechLearn Academy · Conhecimento para abrir novos caminhos.</footer>
    </body>
</html>
