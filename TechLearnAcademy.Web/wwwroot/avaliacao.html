<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Avaliação | TechLearn Academy</title>
        <link rel="stylesheet" href="css/estilo.css">
        <script src="js/config.js" defer>
        </script>
        <script src="js/api.js" defer>
        </script>
        <script src="js/aluno.js" defer>
        </script>
    </head>
    <body data-pagina="avaliacao">
        <a class="pular" href="#conteudo">Ir para o conteúdo</a>
        <header class="cabecalho">
            <a class="marca" href="perfil.html">
                <span class="simbolo" aria-hidden="true">TL</span>
                <span>TechLearn Academy</span>
            </a>
            <div class="usuario">
                <span id="nome-usuario">
                </span>
                <button id="sair" type="button">Sair</button>
            </div>
        </header>
        <nav id="menu" class="menu" aria-label="Menu principal">
        </nav>
        <main class="conteudo">
            <div class="introducao">
                <p class="rotulo">Seu espaço de aprendizagem</p>
                <h1>Avaliação</h1>
                <p class="subtitulo">Você pode responder uma vez por tentativa do curso. A nota mínima é 6. Em caso de reprovação, reinicie o curso para tentar novamente.</p>
            </div>
            <p id="mensagem" class="mensagem" role="status" aria-live="polite" aria-atomic="true">
            </p>
            <div id="conteudo">
                <section class="cartao bloco">
                    <h2 id="titulo-avaliacao">
                    </h2>
                    <p id="andamento">Carregando questões...</p>
                    <progress id="barra-prova" max="100" value="0" aria-label="Questões respondidas">
                    </progress>
                </section>
                <div id="acoes-avaliacao" class="acoes bloco"></div>
                <form id="form-avaliacao" hidden>
                    <div id="questoes">
                    </div>
                    <button type="submit">Enviar respostas</button>
                </form>
            </div>
        </main>
        <footer class="rodape">TechLearn Academy · Conhecimento para abrir novos caminhos.</footer>
    </body>
</html>
